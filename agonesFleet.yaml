apiVersion: "stable.agones.dev/v1alpha1"
kind: Fleet
metadata:
  name: xonotic
spec:
  replicas: 2
  template:
    spec:
      ports:
      - name: default
        portPolicy: "dynamic"
        containerPort: 26000
      template:
        spec:
          containers:
          - name: xonotic
            image: gcr.io/agones-images/xonotic-example:0.3
        